<div class="d-flex min-vh-100 bg-light">

    <div class="bg-dark text-white p-3 d-flex flex-column shadow-sm"
        style="width: 260px; position: sticky; top: 0; height: 100vh;">
        <a routerLink="/admin/dashboard" class="admin-brand text-decoration-none mb-4 mt-2">
            <div class="d-flex align-items-center">
                <img src="assets/img/logo-mark-claro.svg" alt="Cherry Café" height="36" class="brand-mark me-2">
                <span class="brand-type"><span class="brand-script">Cherry</span><span
                        class="brand-serif">Café</span></span>
            </div>
            <span class="admin-brand-sub">Panel de administración</span>
        </a>

        <ul class="nav nav-pills flex-column mb-auto gap-2">
            <li class="nav-item">
                <a routerLink="/admin/dashboard" routerLinkActive="active bg-primary" class="nav-link text-white">
                    <i class="bi bi-graph-up me-2"></i> Resumen
                </a>
            </li>
            <li>
                <a routerLink="/admin/productos" routerLinkActive="active bg-primary" class="nav-link text-white">
                    <i class="bi bi-box-seam me-2"></i> Gestión de Productos
                </a>
            </li>
            <li>
                <a routerLink="/admin/pedidos" routerLinkActive="active bg-primary" class="nav-link text-white">
                    <i class="bi bi-receipt me-2"></i> Pedidos Entrantes
                </a>
            </li>
            <li>
                <a routerLink="/admin/usuarios" routerLinkActive="active bg-primary" class="nav-link text-white">
                    <i class="bi bi-people me-2"></i> Usuarios
                </a>
            </li>
        </ul>

        <hr class="border-secondary">

        <div class="dropdown mt-auto">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
                id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-4 me-2"></i>

                <strong>{{ usuarioActual?.nombre || 'Usuario' }}</strong>
            </a>

            <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li>
                    <a class="dropdown-item" routerLink="/inicio">
                        <i class="bi bi-shop me-2"></i> Ver tienda pública
                    </a>
                </li>
                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>
                    <a class="dropdown-item text-danger" href="#" (click)="cerrarSesion($event)">
                        <i class="bi bi-box-arrow-left me-2"></i> Cerrar sesión
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="flex-grow-1 p-4 overflow-auto">
        <router-outlet></router-outlet>
    </div>

</div>
